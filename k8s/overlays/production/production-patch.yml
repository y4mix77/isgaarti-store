apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: isgaarti
spec:
  template:
    spec:
      containers:
        - name: backend
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: isgaarti
spec:
  template:
    spec:
      containers:
        - name: frontend
          imagePullPolicy: IfNotPresent
