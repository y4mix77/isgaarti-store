spring.application.name=boutique

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/boutique_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


boutique.app.jwtSecret=${JWT_SECRET:CHANGE_ME_USE_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS}
boutique.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
stripe.checkout.success-url=${STRIPE_SUCCESS_URL:http://localhost:4300/panier?stripe_session_id={CHECKOUT_SESSION_ID}}
stripe.checkout.cancel-url=${STRIPE_CANCEL_URL:http://localhost:4300/panier?payment=cancelled}
stripe.checkout.return-url=${STRIPE_RETURN_URL:http://localhost:4300/panier?stripe_session_id={CHECKOUT_SESSION_ID}}

imagekit.private.key=${IMAGEKIT_PRIVATE_KEY:}

cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
