name: ISGAARTI CI

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/isgaarti-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/isgaarti-frontend

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: isgaarti-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/boutique
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile Spring Boot
        run: mvn -DskipTests compile

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Production build
        run: npm run build -- --configuration production

  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t isgaarti-backend:ci backend/boutique

      - name: Build frontend image
        run: docker build -t isgaarti-frontend:ci frontend

  kubernetes:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    needs:
      - docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI secret manifest
        run: cp k8s/02-secret.example.yml k8s/02-secret.yml

      - name: Validate Kubernetes YAML
        run: |
          ruby -ryaml -e '
            files = Dir["k8s/*.yml"].reject { |file| file.end_with?("06-ingress.yml") }
            files.each do |file|
              docs = YAML.load_stream(File.read(file))
              raise "#{file} is empty" if docs.empty?

              docs.each_with_index do |doc, index|
                raise "#{file} document #{index + 1} is not a mapping" unless doc.is_a?(Hash)
                %w[apiVersion kind metadata].each do |key|
                  raise "#{file} document #{index + 1} missing #{key}" unless doc[key]
                end
                raise "#{file} document #{index + 1} missing metadata.name" unless doc.dig("metadata", "name")
              end
            end
          '

  publish:
    name: Publish GHCR Images
    runs-on: ubuntu-latest
    needs:
      - kubernetes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/boutique
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
