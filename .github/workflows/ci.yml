name: ISGAARTI CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: isgaarti-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/boutique
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile Spring Boot
        run: mvn -DskipTests compile

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Production build
        run: npm run build -- --configuration production

  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t isgaarti-backend:ci backend/boutique

      - name: Build frontend image
        run: docker build -t isgaarti-frontend:ci frontend

  kubernetes:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    needs:
      - docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Create CI secret manifest
        run: cp k8s/02-secret.example.yml k8s/02-secret.yml

      - name: Validate Kubernetes YAML
        run: |
          kubectl apply --dry-run=client --validate=false \
            -f k8s/00-namespace.yml \
            -f k8s/01-configmap.yml \
            -f k8s/02-secret.yml \
            -f k8s/03-postgres.yml \
            -f k8s/04-backend.yml \
            -f k8s/05-frontend.yml
